<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Your Order — ChapShop Delivery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script>
        var fc={apiKey:"AIzaSyBjyRehaNQqt5ogt5U3tiw8NYr4TyuX2iI",authDomain:"chapshop-delivery-88fe1.firebaseapp.com",projectId:"chapshop-delivery-88fe1",storageBucket:"chapshop-delivery-88fe1.firebasestorage.app",messagingSenderId:"540757404981",appId:"1:540757404981:web:f5ae5d041dd260304eb07c"};
        firebase.initializeApp(fc);
        var db = firebase.firestore();
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #020617; }
        .tl-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #334155; flex-shrink: 0; }
        .tl-dot.done { background: #06b6d4; border-color: #06b6d4; }
        .tl-line { width: 2px; min-height: 40px; background: #1e293b; flex-shrink: 0; }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md">
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-gradient-to-br from-cyan-500 to-cyan-700 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-cyan-500/20">
                <span class="iconify text-white text-3xl" data-icon="mdi:truck-fast"></span>
            </div>
            <h1 class="text-2xl font-bold text-white">Track Your Order</h1>
            <p class="text-slate-400 text-sm mt-1">Enter your Order ID or Phone Number below</p>
        </div>

        <!-- Search Form -->
        <form onsubmit="trackOrder(event)" class="bg-white/[0.02] border border-white/[0.08] rounded-2xl p-6 space-y-4 mb-6">
            <div>
                <label class="text-xs font-semibold text-slate-400 uppercase">Order ID or Phone Number</label>
                <input type="text" id="track-input" required class="w-full mt-1 bg-white/[0.05] border border-white/[0.1] rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-500/50" placeholder="#VXYDAZ or +255...">
            </div>
            <button type="submit" class="w-full bg-cyan-500 text-white font-semibold py-3 rounded-xl hover:bg-cyan-400 transition-colors shadow-lg shadow-cyan-500/20">Track Order</button>
        </form>

        <!-- Results Area -->
        <div id="track-results" class="hidden"></div>
    </div>

    <script>
        function trackOrder(e) {
            e.preventDefault();
            const input = document.getElementById('track-input').value.trim();
            const resultsDiv = document.getElementById('track-results');
            
            resultsDiv.innerHTML = '<div class="text-center text-slate-400 py-8"><span class="iconify animate-spin inline-block text-2xl" data-icon="mdi:loading"></span><p class="mt-2 text-sm">Searching...</p></div>';
            resultsDiv.classList.remove('hidden');

            // Check if input is a phone number (contains numbers and maybe +)
            const isPhone = /^[0-9+\s\-]+$/.test(input);

            if (isPhone) {
                // Search by Phone
                db.collection('orders').where('customerPhone', '==', input.replace(/[\s\-]/g, '')).get()
                    .then(snapshot => {
                        if (!snapshot.empty) {
                            displayOrder(snapshot.docs[0].data());
                        } else {
                            // Try with original input just in case
                            return db.collection('orders').where('customerPhone', '==', input).get().then(snap => {
                                if (!snap.empty) displayOrder(snap.docs[0].data());
                                else showNotFound();
                            });
                        }
                    })
                    .catch(err => showError());
            } else {
                // Search by Order ID (Full ID or Short ID like #VXYDAZ)
                let cleanId = input.replace('#', '').toUpperCase();
                
                // Try exact match first
                db.collection('orders').doc(cleanId).get()
                    .then(doc => {
                        if (doc.exists) {
                            displayOrder(doc.data());
                        } else {
                            // If not exact, try matching last 6 characters
                            return db.collection('orders').orderBy('createdAt', 'desc').limit(50).get().then(snap => {
                                let found = null;
                                snap.docs.forEach(d => {
                                    if (d.id.slice(-6).toUpperCase() === cleanId.slice(-6).toUpperCase()) {
                                        found = d.data();
                                    }
                                });
                                if (found) displayOrder(found);
                                else showNotFound();
                            });
                        }
                    })
                    .catch(err => showError());
            }
        }

        function displayOrder(o) {
            const resultsDiv = document.getElementById('track-results');
            const steps = [
                { l: 'Order Placed', done: true },
                { l: 'Confirmed by Store', done: ['confirmed', 'out_for_delivery', 'delivered', 'returned'].includes(o.status) },
                { l: 'Out for Delivery', done: ['out_for_delivery', 'delivered', 'returned'].includes(o.status) },
                { l: o.status === 'returned' ? 'Returned' : 'Delivered', done: ['delivered', 'returned'].includes(o.status) }
            ];

            let statusColor = 'bg-yellow-500/10 text-yellow-400 border-yellow-500/20';
            if (o.status === 'delivered') statusColor = 'bg-green-500/10 text-green-400 border-green-500/20';
            if (o.status === 'cancelled' || o.status === 'returned') statusColor = 'bg-red-500/10 text-red-400 border-red-500/20';
            if (o.status === 'out_for_delivery') statusColor = 'bg-violet-500/10 text-violet-400 border-violet-500/20';

            let html = '<div class="bg-white/[0.02] border border-white/[0.08] rounded-2xl p-6 space-y-5">';
            
            // Header
            html += '<div class="flex justify-between items-start">';
            html += '<div><div class="text-xs text-slate-500 uppercase">Order</div><div class="font-bold text-cyan-400 text-lg">#' + (o.id || '').slice(-6).toUpperCase() + '</div></div>';
            html += '<span class="px-3 py-1 rounded-full text-xs font-bold border ' + statusColor + '">' + (o.status || 'pending').replace(/_/g, ' ').toUpperCase() + '</span>';
            html += '</div>';

            // Customer & Item Info
            html += '<div class="border-t border-white/[0.05] pt-4 space-y-2 text-sm">';
            html += '<div class="flex justify-between"><span class="text-slate-500">Customer</span><span class="text-white font-medium">' + (o.customerName || 'N/A') + '</span></div>';
            html += '<div class="flex justify-between"><span class="text-slate-500">Item</span><span class="text-white font-medium text-right">' + (o.itemName || 'N/A') + ' x' + (o.qty || 1) + '</span></div>';
            html += '<div class="flex justify-between"><span class="text-slate-500">Total Amount</span><span class="text-white font-bold">TZS ' + Number(o.totalAmount || 0).toLocaleString() + '</span></div>';
            if (o.riderName) {
                html += '<div class="flex justify-between"><span class="text-slate-500">Rider</span><span class="text-violet-400 font-medium">' + o.riderName + '</span></div>';
            }
            html += '</div>';

            // Tracking Timeline
            html += '<div class="border-t border-white/[0.05] pt-5">';
            html += '<div class="text-xs font-bold text-slate-400 uppercase mb-4">Tracking Journey</div>';
            html += '<div class="space-y-0">';
            
            steps.forEach((step, i) => {
                const last = i === steps.length - 1;
                html += '<div class="flex gap-4">';
                html += '<div class="flex flex-col items-center">';
                html += '<div class="tl-dot ' + (step.done ? 'done' : '') + '"></div>';
                html += (!last ? '<div class="tl-line ' + (step.done ? 'bg-cyan-500/40' : '') + '"></div>' : '');
                html += '</div>';
                html += '<div class="pb-6"><div class="text-sm font-semibold ' + (step.done ? 'text-white' : 'text-slate-600') + '">' + step.l + '</div></div>';
                html += '</div>';
            });

            html += '</div></div></div>';

            resultsDiv.innerHTML = html;
        }
