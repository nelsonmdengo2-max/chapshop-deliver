<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rider Dashboard — ChapShop Delivery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
    <script src="core.js"></script>
    <style>
        *{font-family:'Plus Jakarta Sans',sans-serif;-webkit-font-smoothing:antialiased}
        body{background:#020617;}
        .gradient-text{background:linear-gradient(to bottom,#fff,#fff,#94a3b8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .nav-blur{backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
        .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);opacity:0;pointer-events:none;transition:all .4s cubic-bezier(.16,1,.3,1);white-space:nowrap;z-index:200}
        .toast.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
        .sidebar-link{display:flex;align-items:center;gap:0.75rem;padding:0.65rem 1rem;border-radius:0.75rem;color:#94a3b8;font-weight:500;transition:all .2s;font-size:0.875rem}
        .sidebar-link:hover,.sidebar-link.active{background:rgba(6,182,212,0.1);color:#22d3ee}
        .stat-card{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.08);border-radius:1rem;padding:1rem;}
        @keyframes pulse-text { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
        .pulse-text { animation: pulse-text 1.5s ease-in-out infinite; }
    </style>
</head>
<body class="bg-[#020617] text-white min-h-screen flex flex-col">

    <!-- AUTH LOADER -->
    <div id="auth-loader" class="fixed inset-0 z-[9999] bg-[#020617] hidden flex flex-col items-center justify-center">
        <div class="relative w-16 h-16">
            <div class="absolute inset-0 border-4 border-violet-500/20 rounded-full"></div>
            <div class="absolute inset-0 border-4 border-transparent border-t-violet-500 rounded-full animate-spin"></div>
        </div>
        <p id="auth-loader-text" class="mt-5 text-slate-400 text-sm font-semibold tracking-wide pulse-text">Loading...</p>
    </div>

    <div id="toast" class="toast bg-[#0f172a] border border-violet-500/30 text-white px-6 py-4 rounded-xl shadow-2xl flex items-center gap-3">
        <span id="toast-icon" class="iconify text-violet-400 text-xl" data-icon="mdi:check-circle"></span>
        <span id="toast-msg" class="text-sm font-medium">Success</span>
    </div>

    <!-- LOGIN -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-sm">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-gradient-to-br from-violet-500 to-violet-700 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-violet-500/20"><span class="iconify text-white text-3xl" data-icon="mdi:truck-fast"></span></div>
                <h1 class="text-2xl font-bold gradient-text">Rider Portal</h1>
                <p class="text-slate-400 text-sm mt-1">ChapShop Delivery System</p>
            </div>
            <form method="POST" onsubmit="handleLogin(event)" class="bg-white/[0.02] border border-white/[0.08] rounded-2xl p-6 space-y-4">
                <div><label class="text-xs font-semibold text-slate-400 uppercase">Email</label><input type="email" name="email" required class="w-full mt-1 bg-white/[0.05] border border-white/[0.1] rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-violet-500/50" placeholder="rider@email.com"></div>
                <div><label class="text-xs font-semibold text-slate-400 uppercase">Password</label><input type="password" name="password" required class="w-full mt-1 bg-white/[0.05] border border-white/[0.1] rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-violet-500/50" placeholder="••••••••"></div>
                <button type="submit" class="w-full bg-violet-500 text-white font-semibold py-3 rounded-xl hover:bg-violet-400 transition-colors shadow-lg shadow-violet-500/20">Sign In</button>
            </form>
            <div class="text-center mt-6"><a href="index.html" class="text-sm text-slate-500 hover:text-violet-400 transition-colors">← Back to Website</a></div>
        </div>
    </div>

    <!-- APP -->
    <div id="app-screen" class="hidden flex-col min-h-screen">
        <header class="sticky top-0 z-30 nav-blur bg-[#020617]/80 border-b border-white/[0.08] px-5 py-3 flex items-center justify-between flex-shrink-0">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-gradient-to-br from-violet-500 to-violet-700 rounded-lg flex items-center justify-center"><span class="iconify text-white text-lg" data-icon="mdi:truck-fast"></span></div>
                <div>
                    <span class="font-bold text-white text-sm block">ChapShop Rider</span>
                    <span id="header-name" class="text-xs text-violet-400">Loading...</span>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <div class="text-right">
                    <div class="text-[10px] text-slate-500 uppercase">Cash Holding</div>
                    <div id="header-cash" class="text-sm font-bold text-green-400">TZS 0</div>
                </div>
                <button onclick="handleLogout()" class="text-slate-400 hover:text-white p-2"><span class="iconify text-2xl" data-icon="mdi:logout"></span></button>
            </div>
        </header>

        <div class="flex-1 flex overflow-hidden">
            <!-- SIDEBAR -->
            <aside id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-[#0f172a] border-r border-white/[0.08] z-40 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 flex flex-col">
                <div class="p-4 border-b border-white/[0.08] flex-shrink-0">
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 bg-gradient-to-br from-violet-500 to-violet-700 rounded-lg flex items-center justify-center"><span class="iconify text-white text-lg" data-icon="mdi:truck-fast"></span></div>
                        <span class="font-bold text-white text-sm">ChapShop<span class="text-violet-400 ml-1">Rider</span></span>
                    </div>
                </div>
                <nav class="p-4 space-y-1 flex-1">
                    <div class="text-[10px] font-bold text-slate-600 uppercase px-3 mb-2">Main</div>
                    <button onclick="switchTab('active')" class="sidebar-link active w-full text-left" id="nav-active"><span class="iconify text-lg" data-icon="mdi:road-variant"></span> Active Deliveries</button>
                    <div class="text-[10px] font-bold text-slate-600 uppercase px-3 mb-2 mt-4 pt-4 border-t border-white/[0.05]">Insights</div>
                    <button onclick="switchTab('history')" class="sidebar-link w-full text-left" id="nav-history"><span class="iconify text-lg" data-icon="mdi:history"></span> Delivery History</button>
                </nav>
                <div class="p-4 border-t border-white/[0.08] flex-shrink-0">
                    <button onclick="handleLogout()" class="sidebar-link w-full text-left text-red-400 hover:bg-red-500/10"><span class="iconify text-lg" data-icon="mdi:logout"></span> Logout</button>
                </div>
            </aside>
            <div id="sidebar-overlay" class="fixed inset-0 bg-black/60 z-30 hidden lg:hidden" onclick="toggleSidebar()"></div>

            <!-- MAIN CONTENT -->
            <main class="flex-1 lg:ml-64 p-4 overflow-y-auto pb-24">
                
                <!-- ACTIVE DELIVERIES -->
                <div id="panel-active" class="tab-panel">
                    <div class="grid grid-cols-2 gap-3 mb-5">
                        <div class="stat-card text-center">
                            <div id="stat-active" class="text-xl font-bold text-violet-400">0</div>
                            <div class="text-[10px] text-slate-500 uppercase mt-1">Active</div>
                        </div>
                        <div class="stat-card text-center">
                            <div id="stat-delivered-today" class="text-xl font-bold text-green-400">0</div>
                            <div class="text-[10px] text-slate-500 uppercase mt-1">Delivered Today</div>
                        </div>
                    </div>
                    
                    <div id="active-list" class="space-y-4">
                        <div class="text-center py-12 text-slate-500">
                            <span class="iconify text-4xl text-slate-700 mx-auto block mb-2" data-icon="mdi:package-variant-closed"></span>
                            <p class="text-sm">Loading orders...</p>
                        </div>
                    </div>
                </div>

                <!-- DELIVERY HISTORY -->
                <div id="panel-history" class="tab-panel hidden">
                    <div class="mb-4 relative max-w-sm">
                        <span class="iconify absolute left-3 top-1/2 -translate-y-1/2 text-slate-500" data-icon="mdi:magnify"></span>
                        <input type="text" id="history-search" oninput="renderHistory()" placeholder="Search ID, phone, or name..." class="w-full bg-white/[0.05] border border-white/[0.1] rounded-lg pl-10 pr-4 py-2.5 text-sm text-white focus:outline-none focus:border-violet-500/50">
                    </div>
                    <div class="bg-white/[0.02] border border-white/[0.08] rounded-2xl overflow-x-auto">
                        <table class="w-full text-sm text-left min-w-[800px]">
                            <thead class="text-xs text-slate-400 uppercase bg-white/[0.02]"><tr><th class="px-4 py-3">ID</th><th class="px-4 py-3">Customer</th><th class="px-4 py-3">Amount</th><th class="px-4 py-3">Status</th><th class="px-4 py-3">Date</th></tr></thead>
                            <tbody id="history-table" class="divide-y divide-white/[0.05]"></tbody>
                        </table>
                    </div>
                    <div class="flex flex-col md:flex-row gap-3 mt-4 items-center justify-between text-xs text-slate-400">
                        <div class="flex items-center gap-2">
                            <span>Rows per page:</span>
                            <select id="history-page-size" onchange="changeHistoryPageSize(this.value)" class="bg-white/[0.05] border border-white/[0.1] rounded-lg px-2 py-1 text-white focus:outline-none">
                                <option value="20">20</option>
                                <option value="50">50</option>
                                <option value="100">100</option>
                            </select>
                        </div>
                        <div id="history-pagination-info" class="text-slate-500">Showing 0 to 0 of 0</div>
                        <div class="flex gap-2">
                            <button id="history-prev-btn" onclick="prevHistoryPage()" class="px-3 py-1 bg-white/[0.05] border border-white/[0.1] rounded-lg hover:bg-white/[0.1] disabled:opacity-30">Previous</button>
                            <button id="history-next-btn" onclick="nextHistoryPage()" class="px-3 py-1 bg-white/[0.05] border border-white/[0.1] rounded-lg hover:bg-white/[0.1] disabled:opacity-30">Next</button>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script>
        let myOrders = [];
        let historyPage = 1, historyPageSize = 20;
        const uid = () => window.currentUser.uid;

        function handleLogin(e) {
            e.preventDefault();
            var loader = document.getElementById('auth-loader');
            if(loader) { loader.classList.remove('hidden'); loader.classList.add('flex'); }
            document.getElementById('auth-loader-text').innerText = 'Signing in...';
            const btn = e.target.querySelector('button[type="submit"]');
            btn.innerHTML = 'Signing in...';
            btn.disabled = true;
            auth.signInWithEmailAndPassword(e.target.email.value, e.target.password.value)
                .catch(err => {
                    showT(err.message, "error");
                    if(loader) { loader.classList.add('hidden'); loader.classList.remove('flex'); }
                    btn.innerHTML = 'Sign In';
                    btn.disabled = false;
                });
        }

        function handleLogout() {
            var loader = document.getElementById('auth-loader');
            if(loader) { loader.classList.remove('hidden'); loader.classList.add('flex'); }
            document.getElementById('auth-loader-text').innerText = 'Logging out...';
            auth.signOut();
        }

        auth.onAuthStateChanged(async user => {
            if (user) {
                try {
                    const doc = await db.collection('users').doc(user.uid).get();
                    if (doc.exists && doc.data().active && (doc.data().role === 'shipping' || doc.data().role === 'shipping_manager')) {
                        window.currentUser = { uid: user.uid, ...doc.data() };
                        document.getElementById('header-name').textContent = doc.data().name || 'Rider';
                        document.getElementById('login-screen').classList.add('hidden');
                        document.getElementById('app-screen').classList.remove('hidden');
                        document.getElementById('app-screen').classList.add('flex');
                        loadData();
                    } else {
                        showT("Access Denied. Not a rider account.", "error");
                        auth.signOut();
                    }
                } catch (err) {
                    showT("Error loading profile.", "error");
                    auth.signOut();
                }
            } else {
                var loader = document.getElementById('auth-loader');
                if(loader) { loader.classList.add('hidden'); loader.classList.remove('flex'); }
                document.getElementById('login-screen').classList.remove('hidden');
                document.getElementById('app-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('flex');
                const btn = document.querySelector('#login-screen button[type="submit"]');
                if(btn) { btn.innerHTML = 'Sign In'; btn.disabled = false; }
            }
        });

        function loadData() {
            db.collection('orders')
              .where('riderId', '==', uid())
              .onSnapshot(snap => {
                  myOrders = snap.docs.map(d => ({id: d.id, ...d.data()}));
                  myOrders.sort((a,b) => {
                      const order = {'out_for_delivery': 0, 'confirmed': 1, 'delivered': 2, 'returned': 3};
                      return (order[a.status] || 4) - (order[b.status] || 4);
                  });
                  renderActive();
                  updateStats();
                  renderHistory();
              }, err => {
                  console.error("Listener error: ", err);
                  document.getElementById('active-list').innerHTML = '<div class="text-center py-12 text-red-400"><p class="text-sm">Error loading orders. Check console.</p></div>';
              });
        }

        function updateStats() {
            const active = myOrders.filter(o => o.status === 'confirmed' || o.status === 'out_for_delivery').length;
            const todayStart = new Date(); todayStart.setHours(0,0,0,0);
            const deliveredToday = myOrders.filter(o => o.status === 'delivered' && o.deliveredAt && o.deliveredAt.toDate() >= todayStart).length;
            const cashHolding = myOrders.filter(o => o.status === 'delivered').reduce((s,o) => s + (o.totalAmount||0), 0);
            
            document.getElementById('stat-active').textContent = active;
            document.getElementById('stat-delivered-today').textContent = deliveredToday;
            document.getElementById('header-cash').textContent = 'TZS ' + cashHolding.toLocaleString();
        }

        function renderActive() {
            const c = document.getElementById('active-list');
            const active = myOrders.filter(o => o.status === 'confirmed' || o.status === 'out_for_delivery');
            
            if (!active.length) {
                c.innerHTML = `<div class="text-center py-12 text-slate-500"><span class="iconify text-4xl text-slate-700 mx-auto block mb-2" data-icon="mdi:check-circle-outline"></span><p class="text-sm">No active deliveries. Good job!</p></div>`;
                return;
            }

            c.innerHTML = active.map(o => {
                let actions = '';
                if (o.status === 'confirmed') {
                    actions = `<button onclick="updateStatus('${o.id}', 'out_for_delivery')" class="w-full bg-violet-500 text-white font-bold py-3.5 rounded-xl hover:bg-violet-400 transition-colors flex items-center justify-center gap-2"><span class="iconify text-lg" data-icon="mdi:truck-fast"></span> Start Delivery</button>`;
                } else if (o.status === 'out_for_delivery') {
                    actions = `
                        <div class="grid grid-cols-2 gap-3">
                            <button onclick="updateStatus('${o.id}', 'returned')" class="bg-red-500/20 text-red-400 border border-red-500/30 font-bold py-3.5 rounded-xl hover:bg-red-500/30 transition-colors flex items-center justify-center gap-2"><span class="iconify text-lg" data-icon="mdi:close-circle"></span> Return</button>
                            <button onclick="updateStatus('${o.id}', 'delivered')" class="bg-green-500 text-white font-bold py-3.5 rounded-xl hover:bg-green-400 transition-colors flex items-center justify-center gap-2"><span class="iconify text-lg" data-icon="mdi:check-circle"></span> Delivered</button>
                        </div>
                    `;
                }

                const statusColor = o.status === 'out_for_delivery' ? 'text-violet-400 bg-violet-500/10 border-violet-500/20' : 'text-cyan-400 bg-cyan-500/10 border-cyan-500/20';

                return `
                    <div class="bg-white/[0.02] border border-white/[0.08] rounded-2xl p-4">
                        <div class="flex justify-between items-start mb-3">
                            <div>
                                <span class="font-mono text-violet-400 font-bold text-sm">#${o.id.slice(-6).toUpperCase()}</span>
                                <div class="text-white font-bold text-base mt-1">${o.customerName || 'Unknown'}</div>
                            </div>
                            <span class="text-[10px] font-bold uppercase px-2 py-1 rounded-md border ${statusColor}">${o.status.replace(/_/g, ' ')}</span>
                        </div>
                        
                        <div class="space-y-2 text-sm border-t border-white/[0.05] pt-3 mb-4">
                            <div class="flex items-center gap-2 text-slate-300">
                                <span class="iconify text-slate-500" data-icon="mdi:phone"></span>
                                <a href="tel:${o.customerPhone}" class="hover:text-violet-400">${o.customerPhone || 'N/A'}</a>
                            </div>
                            <div class="flex items-start gap-2 text-slate-300">
                                <span class="iconify text-slate-500 mt-0.5" data-icon="mdi:map-marker"></span>
                                <span>${o.customerAddress || 'N/A'}, ${o.customerCity || ''}</span>
                            </div>
                            <div class="flex items-center justify-between pt-2 border-t border-white/[0.05] mt-2">
                                <span class="text-slate-400 text-xs">${o.itemName || ''} x${o.qty||1}</span>
                                <span class="text-white font-bold">TZS ${Number(o.totalAmount).toLocaleString()}</span>
                            </div>
                        </div>

                        <a href="https://maps.google.com/?q=${encodeURIComponent((o.customerAddress||'') + ' ' + (o.customerCity||''))}" target="_blank" class="block w-full bg-slate-700/50 text-slate-200 font-semibold py-2.5 rounded-xl hover:bg-slate-700 transition-colors text-center text-sm mb-3 flex items-center justify-center gap-2">
                            <span class="iconify" data-icon="mdi:google-maps"></span> Navigate
                        </a>

                        ${actions}
                    </div>
                `;
            }).join('');
        }

        function renderHistory() {
            const tb = document.getElementById('history-table');
            const search = (document.getElementById('history-search').value || '').toLowerCase();
            
            let history = myOrders.filter(o => o.status === 'delivered' || o.status === 'returned');
            
            if(search) {
                history = history.filter(o => o.id.toLowerCase().includes(search) || (o.customerPhone && o.customerPhone.includes(search)) || (o.customerName && o.customerName.toLowerCase().includes(search)));
            }
            
            history.sort((a,b) => (b.updatedAt?.seconds || 0) - (a.updatedAt?.seconds || 0));
            
            const total = history.length;
            const totalPages = Math.ceil(total / historyPageSize);
            if (historyPage > totalPages && totalPages > 0) historyPage = totalPages;
            if (historyPage < 1) historyPage = 1;

            const start = (historyPage - 1) * historyPageSize;
            const end = start + historyPageSize;
            const paginatedItems = history.slice(start, end);
            
            if(!total) { 
                tb.innerHTML = '<tr><td colspan="5" class="text-center text-slate-500 py-8">No history yet.</td></tr>'; 
                updateHistoryPagination(0, 0, 0);
                return; 
            }
            
            tb.innerHTML = paginatedItems.map(o => `
                <tr class="hover:bg-white/[0.02]">
                    <td class="px-4 py-3 font-mono text-violet-400 text-xs">#${o.id.slice(-6).toUpperCase()}</td>
                    <td class="px-4 py-3 text-sm">${o.customerName}<br><span class="text-xs text-slate-500">${o.customerPhone}</span></td>
                    <td class="px-4 py-3 text-sm font-semibold">TZS ${Number(o.totalAmount).toLocaleString()}</td>
                    <td class="px-4 py-3">${getStatusBadge(o.status)}</td>
                    <td class="px-4 py-3 text-xs text-slate-500">${formatDate(o.updatedAt || o.deliveredAt)}</td>
                </tr>
            `).join('');
            
            const actualEnd = Math.min(end, total);
            updateHistoryPagination(total, start + 1, actualEnd);
        }

        function updateHistoryPagination(totalCount, start, end) {
            const info = document.getElementById('history-pagination-info');
            const prevBtn = document.getElementById('history-prev-btn');
            const nextBtn = document.getElementById('history-next-btn');
            const sizeSelect = document.getElementById('history-page-size');
            
            if(sizeSelect) sizeSelect.value = historyPageSize;
            
            if(totalCount === 0) {
                if(info) info.textContent = 'Showing 0 to 0 of 0';
                if(prevBtn) prevBtn.disabled = true;
                if(nextBtn) nextBtn.disabled = true;
                return;
            }
            
            if(info) info.textContent = `Showing ${start} to ${end} of ${totalCount}`;
            
            const totalPages = Math.ceil(totalCount / historyPageSize);
            if(prevBtn) prevBtn.disabled = (historyPage === 1);
            if(nextBtn) nextBtn.disabled = (historyPage >= totalPages);
        }

        function changeHistoryPageSize(size) {
            historyPageSize = parseInt(size);
            historyPage = 1;
            renderHistory();
        }

        function nextHistoryPage() {
            historyPage++;
            renderHistory();
        }

        function prevHistoryPage() {
            historyPage--;
            renderHistory();
        }

        async function updateStatus(id, status) {
            const updateData = { status: status };
            if (status === 'out_for_delivery') updateData.outForDeliveryAt = firebase.firestore.FieldValue.serverTimestamp();
            if (status === 'delivered') updateData.deliveredAt = firebase.firestore.FieldValue.serverTimestamp();
            if (status === 'returned') updateData.returnedAt = firebase.firestore.FieldValue.serverTimestamp();

            // Add to Timeline
            updateData.timeline = firebase.firestore.FieldValue.arrayUnion({
                status: status,
                at: new Date().toISOString(),
                by: window.currentUser.name || 'Rider'
            });
            updateData.updatedAt = firebase.firestore.FieldValue.serverTimestamp();

            try {
                await db.collection('orders').doc(id).update(updateData);
                showT("Order updated successfully!");
            } catch (err) {
                showT(err.message, "error");
            }
        }

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('-translate-x-full'); document.getElementById('sidebar-overlay').classList.toggle('hidden'); }
        function switchTab(t) { 
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden')); 
            document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active')); 
            document.getElementById('panel-' + t).classList.remove('hidden'); 
            document.getElementById('nav-' + t).classList.add('active'); 
            if(window.innerWidth < 1024) toggleSidebar(); 
            if(t === 'history') renderHistory(); 
        }

        function showT(m, t) {
            t = t || "success";
            var el = document.getElementById('toast'), ic = document.getElementById('toast-icon'), ms = document.getElementById('toast-msg');
            ms.textContent = m;
            ic.setAttribute('data-icon', t === 'error' ? 'mdi:alert-circle' : 'mdi:check-circle');
            ic.className = 'iconify text-xl ' + (t === 'error' ? 'text-red-400' : 'text-violet-400');
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
