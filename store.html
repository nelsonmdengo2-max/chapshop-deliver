<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChapShop Marketplace — Shop from our Merchants</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <style>
        *{font-family:'Plus Jakarta Sans',sans-serif;-webkit-font-smoothing:antialiased}
        body{background:#020617;}
        .gradient-text{background:linear-gradient(to bottom,#fff,#fff,#94a3b8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    </style>
</head>
<body class="bg-[#020617] text-white min-h-screen">

    <nav class="bg-[#0f172a] border-b border-white/[0.08] px-6 py-3 flex items-center justify-between sticky top-0 z-50">
        <a href="index.html" class="flex items-center gap-2.5">
            <div class="w-9 h-9 bg-gradient-to-br from-cyan-500 to-cyan-700 rounded-lg flex items-center justify-center"><span class="iconify text-white text-lg" data-icon="mdi:truck-fast"></span></div>
            <span class="font-bold text-white text-[15px]">ChapShop<span class="text-cyan-400 ml-0.5">Delivery</span></span>
        </a>
        <a href="index.html" class="text-sm text-slate-400 hover:text-white transition-colors">← Back to Home</a>
    </nav>

    <header class="py-12 text-center px-6">
        <h1 class="text-3xl md:text-4xl font-bold gradient-text mb-3">ChapShop Marketplace</h1>
        <p class="text-slate-400 text-sm max-w-md mx-auto">Browse our verified merchants and shop directly. Fast delivery, Cash on Delivery accepted.</p>
    </header>

    <main class="max-w-6xl mx-auto px-6 pb-24">
        <div id="loading" class="text-center py-20">
            <span class="iconify text-4xl text-cyan-400 animate-spin inline-block" data-icon="mdi:loading"></span>
            <p class="text-slate-500 text-sm mt-4">Loading merchants...</p>
        </div>
        <div id="merchants-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 hidden"></div>
        <div id="no-merchants" class="text-center py-20 hidden">
            <span class="iconify text-5xl text-slate-700 mx-auto block mb-4" data-icon="mdi:storefront-outline"></span>
            <p class="text-slate-500 text-sm">No merchants available yet. Check back soon!</p>
        </div>
    </main>

    <script>
        var fc={apiKey:"AIzaSyBjyRehaNQqt5ogt5U3tiw8NYr4TyuX2iI",authDomain:"chapshop-delivery-88fe1.firebaseapp.com",projectId:"chapshop-delivery-88fe1",storageBucket:"chapshop-delivery-88fe1.firebasestorage.app",messagingSenderId:"540757404981",appId:"1:540757404981:web:f5ae5d041dd260304eb07c"};
        firebase.initializeApp(fc);var db=firebase.firestore();

        async function loadMerchants() {
            try {
                // Get all approved merchants
                var snap = await db.collection('users').where('role', '==', 'merchant').where('approved', '==', true).get();
                var merchants = snap.docs.map(d => ({id: d.id, ...d.data()}));
                
                document.getElementById('loading').classList.add('hidden');
                
                if(merchants.length === 0) {
                    document.getElementById('no-merchants').classList.remove('hidden');
                    return;
                }

                const grid = document.getElementById('merchants-grid');
                grid.classList.remove('hidden');
                grid.innerHTML = merchants.map(m => `
                    <a href="store.html?merchant=${m.id}" class="bg-white/[0.02] border border-white/[0.08] rounded-2xl p-6 hover:border-cyan-500/30 transition-all flex flex-col items-center text-center group">
                        <div class="w-16 h-16 bg-gradient-to-br from-cyan-500/10 to-cyan-700/10 border border-cyan-500/20 rounded-2xl flex items-center justify-center mb-4 group-hover:scale-105 transition-transform">
                            <span class="iconify text-3xl text-cyan-400" data-icon="mdi:storefront-outline"></span>
                        </div>
                        <h3 class="text-base font-bold text-white mb-1">${m.shopName || m.name || 'Merchant'}</h3>
                        <p class="text-xs text-slate-500 mb-4">${m.city || 'Tanzania'}</p>
                        <div class="mt-auto bg-cyan-500/20 text-cyan-400 border border-cyan-500/30 text-xs font-bold px-4 py-2 rounded-lg w-full">Visit Store</div>
                    </a>
                `).join('');

            } catch(e) {
                console.error("Error loading merchants:", e);
                document.getElementById('loading').innerHTML = '<p class="text-red-400 text-sm">Error loading marketplace.</p>';
            }
        }

        loadMerchants();
    </script>
</body>
</html>
